<section
  id="menu"
  class="px-6 pb-20 -mt-32 bg-transparent text-white relative z-20"
>
  <div class="max-w-6xl mx-auto">
    <div
      class="bg-[#1a1a1a]/80 backdrop-blur-md border border-white/5 rounded-2xl p-8 shadow-2xl mb-12"
    >
      <div class="mb-8 text-center">
        <h2
          class="mb-2 text-3xl font-display md:text-5xl uppercase tracking-tight"
        >
          BBQ HEAVEN
        </h2>
        <p class="text-primary font-bold uppercase tracking-widest text-xs">
          Our aim is to satisfy your cravings and enjoy our friendly
          environment.
        </p>
      </div>

      <div class="flex flex-col items-center gap-8">
        <div id="category-filters" class="flex flex-wrap justify-center gap-3">
          <button
            onclick="setCategory('all', this)"
            class="cat-btn active-cat px-6 py-2 border border-primary text-primary font-bold uppercase text-[10px] tracking-widest rounded-full transition-all"
          >
            All
          </button>
          <button
            onclick="setCategory('starters', this)"
            class="cat-btn px-6 py-2 border border-white/10 text-gray-400 font-bold uppercase text-[10px] tracking-widest rounded-full transition-all hover:border-primary"
          >
            Starters
          </button>
          <button
            onclick="setCategory('mains', this)"
            class="cat-btn px-6 py-2 border border-white/10 text-gray-400 font-bold uppercase text-[10px] tracking-widest rounded-full transition-all hover:border-primary"
          >
            Mains
          </button>
          <button
            onclick="setCategory('bbq_table', this)"
            class="cat-btn px-6 py-2 border border-white/10 text-gray-400 font-bold uppercase text-[10px] tracking-widest rounded-full transition-all hover:border-primary"
          >
            Platters
          </button>
          <button
            onclick="setCategory('kids_corner', this)"
            class="cat-btn px-6 py-2 border border-white/10 text-gray-400 font-bold uppercase text-[10px] tracking-widest rounded-full transition-all hover:border-primary"
          >
            Kids Corner
          </button>
          <button
            onclick="setCategory('drinks', this)"
            class="cat-btn px-6 py-2 border border-white/10 text-gray-400 font-bold uppercase text-[10px] tracking-widest rounded-full transition-all hover:border-primary"
          >
            Drinks
          </button>
        </div>

        <div class="w-full max-w-md relative">
          <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              ></path>
            </svg>
          </span>
          <input
            type="text"
            id="menuSearch"
            onkeyup="filterMenu()"
            placeholder="Search menu..."
            class="w-full py-4 pl-12 pr-4 text-white rounded-xl bg-black/40 border border-white/10 focus:border-primary outline-none transition-all shadow-inner"
          />
        </div>
      </div>
    </div>

    <div
      id="menuGrid"
      class="grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-3"
    ></div>

    <div id="noResults" class="hidden text-center py-20 text-gray-500">
      <p>No items found matching your search.</p>
    </div>
  </div>
</section>
