<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BBQ Heaven Rockingham | Best Smoked Brisket & Woodfire Ribs</title>
    <meta
      name="description"
      content="Experience authentic low & slow BBQ in Rockingham. From tender beef brisket to bourbon ribs, visit BBQ Heaven at Unit 6, 6 Acute Court, Rockingham WA 6168. Order online now!"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="/hero.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <script>
      window.tailwind = window.tailwind || {};
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#d97706",
              smoke: "#1a1a1a",
            },
            fontFamily: {
              display: ["Oswald", "sans-serif"],
            },
          },
        },
      };
    </script>

    <script type="application/ld+json">
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "BBQ Heaven Rockingham",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Unit 6, 6 Acute Court",
          "addressLocality": "Rockingham",
          "addressRegion": "WA",
          "postalCode": "6168",
          "addressCountry": "AU"
        },
        "telephone": "+61895676048",
        "servesCuisine": "BBQ",
        "priceRange": "$$",
        "url": "https://bbqheaven.au"
      }
      </script>
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="canonical" href="https://bbqheaven.au/" />
  </head>
  <!-- <body class="bg-[#121212] text-white font-sans antialiased"> -->
  <body class="bg-black">
    <script src="/env.js"></script>
    <button
      id="backToTop"
      onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
      class="fixed bottom-8 right-8 z-50 p-4 bg-primary text-white rounded-full shadow-2xl hover:scale-110 transition-all opacity-0 pointer-events-none"
    >
      <svg
        class="w-6 h-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.5"
          d="M5 10l7-7m0 0l7 7m-7-7v18"
        ></path>
      </svg>
    </button>
    <div class="fire-bg-animate"></div>
    <div class="relative z-10 bg-black/40 min-height-screen">
      <div id="header-placeholder"></div>

      <main class="relative">
        <!-- <section
          id="hero"
          class="relative h-[50vh] w-full overflow-hidden bg-neutral-900 z-10"
        >
          <div
            class="absolute inset-0 bg-cover bg-center bg-no-repeat transition-transform duration-[15s] scale-105 hover:scale-100"
            style="background-image: url(&quot;./images/hero.jpg&quot;)"
          ></div>
          <div
            class="absolute inset-0 bg-gradient-to-b from-transparent to-black/40"
          ></div>
        </section> -->

        <section
          id="hero"
          class="relative h-[50vh] w-full overflow-hidden bg-neutral-900 z-10"
        >
          <div
            class="absolute inset-0 bg-cover bg-center bg-no-repeat animate-slow-zoom"
            style="background-image: url(&quot;./images/hero.webp&quot;)"
          ></div>

          <div
            class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/80 z-10"
          ></div>
        </section>

        <div id="menu-placeholder" class="relative z-20 -mt-24"></div>

        <div id="location-placeholder" class="relative z-10"></div>
      </main>

      <div id="footer-placeholder"></div>
    </div>

    <div
      id="menuModal"
      class="hidden fixed inset-0 z-[150] flex items-center justify-center p-4"
    >
      <div
        class="absolute inset-0 bg-black/90 backdrop-blur-sm"
        onclick="closeMenuModal()"
      ></div>
      <div
        class="relative bg-smoke border border-white/10 w-full max-w-2xl rounded-xl overflow-hidden shadow-2xl"
      >
        <button
          onclick="closeMenuModal()"
          class="absolute top-4 right-4 z-20 text-white/50 hover:text-white text-2xl"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="flex flex-col">
          <div class="aspect-video bg-black overflow-hidden">
            <img
              id="modalImage"
              src=""
              alt=""
              class="w-full h-full object-cover"
            />
          </div>
          <div class="p-8">
            <div class="flex justify-between items-start mb-4">
              <h2
                id="modalTitle"
                class="text-3xl font-display uppercase tracking-tight text-white"
              ></h2>
              <span
                id="modalPrice"
                class="text-xl font-bold text-primary"
              ></span>
            </div>
            <p
              id="modalDescription"
              class="text-gray-400 mb-8 leading-relaxed"
            ></p>

            <button
              id="modalAddBtn"
              class="w-full py-4 bg-primary text-white font-bold uppercase tracking-widest rounded-lg hover:bg-amber-600 transition-colors flex items-center justify-center gap-2"
            >
              <i class="fa-solid fa-plus"></i> Add to Order List
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      id="orderModal"
      class="fixed inset-0 z-[1000] hidden bg-black/90 flex items-center justify-center p-0 md:p-6"
    >
      <div
        class="bg-smoke w-full h-full md:w-[600px] md:h-[85vh] md:rounded-2xl flex flex-col relative overflow-hidden"
      >
        <div
          class="p-6 border-b border-white/10 flex justify-between items-center bg-smoke z-10"
        >
          <h2
            class="text-2xl font-display uppercase tracking-widest text-white"
          >
            Your Order
          </h2>
          <button
            onclick="closeOrderModal()"
            class="text-white hover:text-primary p-2"
          >
            <i class="fa-solid fa-xmark text-2xl"></i>
          </button>
        </div>

        <div
          id="orderItemsContainer"
          class="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar"
        ></div>

        <div
          id="orderFooter"
          class="p-6 bg-black/40 border-t border-white/10"
        ></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./main.js"></script>

    <script
      src="https://www.fbgcdn.com/embedder/js/ewm2.js"
      defer
      async
    ></script>
  </body>
</html>
